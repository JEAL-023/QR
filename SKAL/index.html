<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SKÅL - Pizzería</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --negro: #000000;
      --dorado: #D4AF37;
      --dorado-claro: #F5D27A;
      --blanco-suave: #F8F5E9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background-color: var(--negro);
      color: var(--blanco-suave);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      padding: 24px 18px 28px;
      background: radial-gradient(circle at top, #1b1b1b 0%, #000000 60%);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
    }

    .logo {
      width: 180px;
      height: 180px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--dorado);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dorado);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--blanco-suave);
      opacity: 0.9;
      margin-bottom: 18px;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--dorado-claro);
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 18px 0 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid var(--dorado);
      background: transparent;
      color: var(--blanco-suave);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: all 0.18s ease;
    }

    .btn-primary {
      background: var(--dorado);
      color: var(--negro);
    }

      transform: translateY(-1px);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
      border-color: var(--dorado
