<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada · JEAL Studio</title>
<meta name="robots" content="noindex" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(60% 45% at 50% 0%, rgba(155, 91, 255, 0.28), transparent 70%), #0b0a0f;
    color: #fff;
    text-align: center;
  }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: #b8b8c9; margin: 0 0 24px; }
  a {
    display: inline-block;
    padding: 14px 24px;
    border-radius: 14px;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    background: linear-gradient(120deg, #9b5bff, #ff4fd8);
  }
</style>
</head>
<body>
  <main>
    <h1>Esta página no existe</h1>
    <p>Te llevamos al inicio de JEAL Studio…</p>
    <a id="inicio" href="/">Ir al inicio</a>
  </main>
  <script>
    // En github.io la web vive en /QR/; con dominio propio, en la raíz
    const home = location.hostname.endsWith("github.io") ? "/QR/" : "/";
    document.getElementById("inicio").href = home;
    setTimeout(() => location.replace(home), 2500);
  </script>
</body>
</html>
