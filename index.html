<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JEAL Studio · Hub</title>

<style>
  :root {
    --violet: #9b5bff;
    --violet-light: #c7a3ff;
    --pink: #ff4fd8;
    --bg: #05030a;
    --text: #f5f5ff;
    --muted: #b8b8d9;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", system-ui, sans-serif;
  }

  body {
    background: radial-gradient(circle at top, #1a1030, #05030a 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
    overflow-x: hidden;
  }

  /* Fondo animado */
  .orb {
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: -2;
    animation: float 18s ease-in-out infinite alternate;
  }

  .orb.violet { background: #7a3bff; top: -80px; left: -60px; }
  .orb.pink { background: #ff2fb0; bottom: -120px; right: -40px; animation-delay: 4s; }

  @keyframes float {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(20px,-30px) scale(1.05); }
  }

  /* Logo */
  .logo {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo-title {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(120deg, #fff, var(--violet-light), var(--pink));
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 18px rgba(155, 91, 255, 0.4);
  }

  .logo-sub {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Botones */
  .hub {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    border: 1px solid rgba(155, 91, 255, 0.6);
    background: rgba(20, 10, 40, 0.6);
    backdrop-filter: blur(6px);
    box-shadow: 0 0 14px rgba(155, 91, 255, 0.35);
    transition: 0.15s ease-out;
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 22px rgba(255, 79, 216, 0.55);
    border-color: var(--pink);
  }

  .btn span {
    margin-right: 10px;
    font-size: 1.3rem;
  }

  /* Alias */
  .alias-box {
    text-align: center;
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .alias {
    font-family: monospace;
    font-size: 1rem;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(155, 91, 255, 0.5);
    display: inline-block;
    margin-bottom: 10px;
  }

  /* Logo Classic */
  .classic {
    margin-top: 40px;
    text-align: center;
    opacity: 0.7;
  }

  .classic-box {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px dashed rgba(155, 91, 255, 0.5);
    background: rgba(255,255,255,0.03);
    font-size: 0.9rem;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 10, 40, 0.9);
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--violet);
    color: var(--text);
    opacity: 0;
    transition: 0.2s ease-out;
    pointer-events: none;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-6px);
  }
</style>
</head>

<body>

<div class="orb violet"></div>
<div class="orb pink"></div>

<div class="logo">
  <div class="logo-title">JEAL Studio</div>
  <div class="logo-sub">Hub Principal</div>
</div>

<div class="hub">

  <!-- WhatsApp -->
  <a class="btn" href="https://wa.me/5491161067544?text=Hola%20JEAL%20Studio%2C%20quiero%20hacer%20un%20pedido%203D." target="_blank">
    <span>💬</span> Hacer un pedido
  </a>

  <!-- Alias -->
  <a class="btn" href="#" onclick="copiarAlias()">
    <span>📋</span> Copiar alias de pago
  </a>

  <!-- Instagram -->
  <a class="btn" href="https://instagram.com" target="_blank">
    <span>📸</span> Instagram
  </a>

  <!-- Portfolio -->
  <a class="btn" href="#portfolio">
    <span>🧩</span> Portfolio
  </a>

  <!-- Ubicación -->
  <a class="btn" href="https://maps.google.com" target="_blank">
    <span>📍</span> Ubicación
  </a>

  <!-- Página completa (futuro) -->
  <a class="btn" href="#" onclick="alert('Pronto: Landing completa de JEAL Studio')">
    <span>🌐</span> Página completa
  </a>

</div>

<div class="alias-box">
  <div class="alias">Miviajealespacio</div><br>
  Alias para pagos en Mercado Pago
</div>

<div class="classic">
  <div class="classic-box">
    JEAL Classic (placeholder)
  </div>
</div>

<div id="toast">Alias copiado</div>

<script>
function copiarAlias() {
  const alias = "Miviajealespacio";
  navigator.clipboard.writeText(alias).then(() => {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  });
}
</script>

</body>
</html>
